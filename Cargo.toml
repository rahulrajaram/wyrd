[package]
name = "wyrd"
version = "0.1.0"
edition = "2024"
description = "Semantic companion CLI for yore"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ndarray = "0.16"
ort = "=2.0.0-rc.6"
ort-sys = "=2.0.0-rc.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.21"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
